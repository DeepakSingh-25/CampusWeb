<div class="gst-card"><h2 class="gst-card-title">Attendance Register · November 2026</h2><div class="table-scroll campus-list attendance-list"><table><thead><tr><th>{{registerLabel}}</th>@for(d of days;track d){<th>{{d}}</th>}</tr></thead><tbody>@for(n of registerPaging.slice(registerNames);track n;let i=$index){<tr><th>{{n}}</th>@for(d of days;track d){<td><span class="code" [attr.data-code]="attendance(registerPaging.start+i,d)">{{attendance(registerPaging.start+i,d)}}</span></td>}</tr>}</tbody></table></div></div><campus-pagination [total]="registerNames.length" [(window)]="registerPaging"></campus-pagination>
