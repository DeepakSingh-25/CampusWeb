@if(loading()){<p role="status">Loading attendance codes…</p>}
@else if(loadError()){<p role="alert">{{loadError()}}</p><button class="btn btn-primary" (click)="load()">Retry</button>}
@else{
  @if(session.user()?.role==='Owner / Admin'){
    @if(draft){
      <form class="gst-card profile mb-3" #form="ngForm" (ngSubmit)="form.valid && save()">
        <label>Code<input class="form-control" required maxlength="12" pattern="[A-Za-z][A-Za-z0-9]*" name="code" [(ngModel)]="draft.code"></label>
        <label>Meaning<input class="form-control" required maxlength="100" name="meaning" [(ngModel)]="draft.meaning"></label>
        <label>Category<select class="form-select" name="category" [(ngModel)]="draft.category" (ngModelChange)="draft.category!=='Working' && (draft.credit=0)">@for(c of categories;track c){<option>{{c}}</option>}</select></label>
        <label>Daily credit<input class="form-control" type="number" required min="0" max="1" step="0.01" name="credit" [readonly]="draft.category!=='Working'" [(ngModel)]="draft.credit"></label>
        <footer class="profile-actions">@if(error()){<span role="alert">{{error()}}</span>}
          <button class="btn btn-outline-secondary" type="button" [disabled]="busy()" (click)="draft=undefined">Cancel</button>
          <button class="btn btn-primary" [disabled]="busy() || form.invalid">Save code</button>
        </footer>
      </form>
    }@else{<button class="btn btn-primary mb-3" (click)="start()">Add attendance code</button>}
  }
  @if(message()){<p role="status">{{message()}}</p>}
  <campus-module-screen moduleName="Attendance" section="Attendance Code" icon="fa-solid fa-clock" [records]="table()" />
}
